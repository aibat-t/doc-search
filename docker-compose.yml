services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: docs
    ports:
      - "5432:5432"   # если 5432 занят локальным Postgres — поменяйте на "5433:5432" и DOC_DATABASE_URL
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d docs"]
      interval: 5s
      retries: 10

  kafka:
    # Один брокер в режиме KRaft (без ZooKeeper); слушает localhost:9092
    image: apache/kafka:3.9.0
    ports:
      - "9092:9092"

volumes:
  pgdata:
